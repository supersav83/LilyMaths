<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Quest & Dad Prizes!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edd8, #fed6e3, #d4fc79);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: #ff4757;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .progress-bar {
            font-size: 1.1rem;
            color: #57606f;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .stars {
            font-size: 1.4rem;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ff9f1a;
        }

        .milestone-tracker {
            font-size: 0.95rem;
            color: #747d8c;
            background: #fff0f5;
            padding: 6px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Toggles Container */
        .controls-container {
            display: flex;
            justify-content: space-around;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #2f3542;
            cursor: pointer;
        }

        .toggle-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #ff4757;
        }

        /* Timer Bar */
        .timer-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            display: none;
        }

        .timer-bar {
            height: 100%;
            background-color: #ff4757;
            width: 100%;
            transition: width 1s linear, background-color 0.3s;
        }

        .question-box {
            font-size: 3.5rem;
            font-weight: bold;
            color: #2ed573;
            background: #f1f2f6;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            font-size: 2rem;
            width: 120px;
            text-align: center;
            padding: 10px;
            border: 3px solid #70a1ff;
            border-radius: 10px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #1e90ff;
        }

        button.submit-btn {
            font-size: 1.5rem;
            padding: 10px 25px;
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
            transition: transform 0.1s;
        }

        button.submit-btn:hover {
            transform: scale(1.05);
        }

        .hint-btn {
            background: #ffa502;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .hint-btn:hover {
            background: #eccc68;
        }

        .hint-box {
            display: none;
            background: #eccc6833;
            border: 2px dashed #ffa502;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.95rem;
            color: #57606f;
            text-align: left;
        }

        .feedback {
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 30px;
            margin-top: 15px;
        }

        .correct { color: #2ed573; }
        .wrong { color: #ff4757; }

        .reset-btn {
            background: transparent;
            border: 1px solid #ced6e0;
            color: #a4b0be;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 25px;
        }

        .reset-btn:hover {
            background: #ff4757;
            color: white;
            border-color: #ff4757;
        }

        /* Reward Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: popin 0.3s ease-out;
        }

        @keyframes popin {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        .prize-title {
            font-size: 2rem;
            color: #ffa502;
            margin-bottom: 10px;
        }

        .modal-btn {
            font-size: 1.2rem;
            padding: 10px 20px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>⭐ Times Tables Quest ⭐</h1>
    <div class="stars" id="starContainer">Total Stars: 0 ⭐</div>
    <div class="milestone-tracker" id="milestoneTracker">Next Mega Prize at 100 Stars! 🍔</div>

    <!-- Mode Toggles -->
    <div class="controls-container">
        <label class="toggle-group" id="hardModeLabel">
            <input type="checkbox" id="hardModeToggle" onchange="toggleHardMode()">
            ⚡ Hard Mode (No Hints)
        </label>
        <label class="toggle-group" id="timedModeLabel">
            <input type="checkbox" id="timedModeToggle" onchange="toggleTimedMode()">
            ⏱️ Timed (10s)
        </label>
    </div>

    <!-- Timer Visual Bar -->
    <div class="timer-container" id="timerContainer">
        <div class="timer-bar" id="timerBar"></div>
    </div>

    <div class="progress-bar" id="progressText">Question 1 of 10</div>

    <div class="question-box" id="question">? × ?</div>

    <form id="answerForm" onsubmit="checkAnswer(event)">
        <input type="number" id="userAnswer" placeholder="?" required autofocus autocomplete="off">
        <button type="submit" class="submit-btn" id="submitBtn">Go!</button>
    </form>

    <br>
    <button type="button" class="hint-btn" id="hintBtn" onclick="toggleHint()">💡 Need a Hint?</button>
    <div class="hint-box" id="hintBox"></div>

    <div class="feedback" id="feedback"></div>

    <button type="button" class="reset-btn" onclick="resetStars()">🔄 Reset Stars</button>
</div>

<!-- Round Reward Modal -->
<div class="modal" id="rewardModal">
    <div class="modal-content">
        <div class="prize-title" id="prizeTitle">🎉 Round Complete!</div>
        <p id="prizeDescription" style="font-size: 1.2rem; white-space: pre-line;"></p>
        <button class="modal-btn" onclick="closeModal()">Start Next Round!</button>
    </div>
</div>

<!-- Big Milestone Star Modal -->
<div class="modal" id="milestoneModal">
    <div class="modal-content" style="border: 4px solid #ff4757;">
        <div class="prize-title" style="color: #ff4757;">🌟 MEGA MILESTONE UNLOCKED! 🌟</div>
        <p id="milestoneDescription" style="font-size: 1.3rem; font-weight: bold; white-space: pre-line;"></p>
        <button class="modal-btn" style="background: #ff4757;" onclick="closeMilestoneModal()">AWESOME!</button>
    </div>
</div>

<script>
    let num1, num2, correctAnswer;
    let currentQuestion = 1;
    let roundScore = 0;
    
    // Timer Variables
    let timerInterval = null;
    let timeLeft = 10;
    
    // Load saved stars from local storage or start at 0
    let totalStars = parseInt(localStorage.getItem('totalStars')) || 0;
    let claimedMilestones = JSON.parse(localStorage.getItem('claimedMilestones')) || [];

    // Per-round Prizes (Sets of 10)
    const roundPrizes = [
        { score: 10, prize: "🎁 Perfect 10/10!\nYou unlocked: Extra 15 mins stay up time / Tablet time!" },
        { score: 9,  prize: "🍦 9/10 Great job!\nYou unlocked: An Ice Cream or Treat!" },
        { score: 8,  prize: "⭐ 8/10 Well done!\nYou unlocked: Pick tonight's movie or game!" },
        { score: 7,  prize: "👍 7/10 Good effort!\nKeep going to get the bigger prizes!" }
    ];

    // Cumulative Star Milestone Rewards
    const milestoneRewards = [
        { stars: 100, reward: "🍔 100 STARS REACHED! 🍔\n\nYou unlocked a Trip to McDonald's!\n\n⚡ Level Up: Hints are now permanently turned OFF!" },
        { stars: 200, reward: "🍿 200 STARS REACHED! 🍿\n\nYou unlocked a Cinema Trip!\n\n⏱️ Level Up: Timed mode is now permanently turned ON!" },
        { stars: 300, reward: "🧸 300 STARS REACHED! 🧸\n\nYou unlocked a new toy!" },
        { stars: 400, reward: "🎡 400 STARS REACHED! 🎡\n\nYou unlocked a Fun Day Out!" }
    ];

    function updateStarDisplay() {
        document.getElementById('starContainer').innerText = `Total Stars: ${totalStars} ⭐`;
        
        let nextMilestone = milestoneRewards.find(m => totalStars < m.stars);
        if (nextMilestone) {
            document.getElementById('milestoneTracker').innerText = `Next Mega Prize at ${nextMilestone.stars} Stars! (${nextMilestone.stars - totalStars} to go!)`;
        } else {
            document.getElementById('milestoneTracker').innerText = `🌟 You've unlocked ALL Mega Rewards! Master Mathematician! 🌟`;
        }

        applyStarRules();
    }

    function applyStarRules() {
        const hardToggle = document.getElementById('hardModeToggle');
        const timedToggle = document.getElementById('timedModeToggle');
        const hardLabel = document.getElementById('hardModeLabel');
        const timedLabel = document.getElementById('timedModeLabel');

        // At 100 stars: Hints removed
        if (totalStars >= 100) {
            hardToggle.checked = true;
            hardToggle.disabled = true;
            hardLabel.title = "Locked ON at 100+ Stars!";
        } else {
            hardToggle.disabled = false;
            hardLabel.title = "";
        }

        // At 200 stars: Always timed mode
        if (totalStars >= 200) {
            timedToggle.checked = true;
            timedToggle.disabled = true;
            timedLabel.title = "Locked ON at 200+ Stars!";
        } else {
            timedToggle.disabled = false;
            timedLabel.title = "";
        }

        toggleHardMode();
        toggleTimedMode();
    }

    function checkMilestoneRewards() {
        for (let m of milestoneRewards) {
            if (totalStars >= m.stars && !claimedMilestones.includes(m.stars)) {
                claimedMilestones.push(m.stars);
                localStorage.setItem('claimedMilestones', JSON.stringify(claimedMilestones));
                
                document.getElementById('milestoneDescription').innerText = m.reward;
                document.getElementById('milestoneModal').style.display = 'flex';
                return true;
            }
        }
        return false;
    }

    function toggleHardMode() {
        const isHard = document.getElementById('hardModeToggle').checked;
        const hintBtn = document.getElementById('hintBtn');
        const hintBox = document.getElementById('hintBox');

        if (isHard) {
            hintBtn.style.display = 'none';
            hintBox.style.display = 'none';
        } else {
            hintBtn.style.display = 'inline-block';
        }
    }

    function toggleTimedMode() {
        const isTimed = document.getElementById('timedModeToggle').checked;
        const timerContainer = document.getElementById('timerContainer');
        timerContainer.style.display = isTimed ? 'block' : 'none';

        if (isTimed && !timerInterval && document.getElementById('userAnswer').disabled === false) {
            startTimer();
        } else if (!isTimed) {
            stopTimer();
        }
    }

    function startTimer() {
        stopTimer();
        timeLeft = 10;
        const timerBar = document.getElementById('timerBar');
        timerBar.style.width = '100%';

        timerInterval = setInterval(() => {
            timeLeft--;
            const widthPercentage = (timeLeft / 10) * 100;
            timerBar.style.width = `${widthPercentage}%`;

            if (timeLeft <= 0) {
                stopTimer();
                handleTimeout();
            }
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function handleTimeout() {
        const feedback = document.getElementById('feedback');
        feedback.className = "feedback wrong";
        feedback.innerText = `⏰ Time's up! ${num1} × ${num2} = ${correctAnswer}`;
        
        document.getElementById('userAnswer').disabled = true;
        document.getElementById('submitBtn').disabled = true;

        advanceQuestion();
    }

    function getHint(a, b) {
        const target = (a === 9 || b === 9) ? 9 :
                       (a === 5 || b === 5) ? 5 :
                       (a === 10 || b === 10) ? 10 :
                       (a === 11 || b === 11) ? 11 :
                       (a === 4 || b === 4) ? 4 :
                       (a === 8 || b === 8) ? 8 :
                       (a === 6 || b === 6) ? 6 :
                       (a === 12 || b === 12) ? 12 : a;

        const other = (target === a) ? b : a;

        switch(target) {
            case 1:
                return " Anything times 1 stays the exact same number!";
            case 2:
                return ` Just double ${other}! (${other} + ${other})`;
            case 3:
                return ` Double ${other}, then add one more ${other}!`;
            case 4:
                return ` Double ${other}, then double it again!`;
            case 5:
                return ` Multiply ${other} by 10 (which is ${other * 10}), then cut it in half! (Or count in 5s: 5, 10, 15...)`;
            case 6:
                return ` Multiply ${other} by 5, then add one more ${other}!`;
            case 7:
                return ` Multiply ${other} by 5, then add (${other} × 2)!`;
            case 8:
                return ` Double ${other}, double it again, and double it one more time!`;
            case 9:
                return ` <b>Trick 1:</b> Multiply ${other} by 10 (which is ${other * 10}), then subtract ${other}!<br><b>Trick 2 (Fingers):</b> Hold out 10 fingers, fold down finger number ${other}. Count fingers on the left for tens, right for units!`;
            case 10:
                return ` Just put a 0 on the end of ${other}! (${other} ➔ ${other}0)`;
            case 11:
                return (other < 10) 
                    ? ` Repeat the digit twice! (${other} becomes ${other}${other})` 
                    : ` Multiply ${other} by 10 (which is ${other * 10}), then add ${other}!`;
            case 12:
                return ` Multiply ${other} by 10, then add (${other} × 2)!`;
            default:
                return " Break it down into smaller parts!";
        }
    }

    function generateQuestion() {
        stopTimer();
        num1 = Math.floor(Math.random() * 12) + 1;
        num2 = Math.floor(Math.random() * 12) + 1;
        correctAnswer = num1 * num2;
        
        document.getElementById('question').innerText = `${num1} × ${num2}`;
        const input = document.getElementById('userAnswer');
        input.value = '';
        input.disabled = false;
        document.getElementById('submitBtn').disabled = false;
        
        document.getElementById('hintBox').style.display = 'none';
        document.getElementById('hintBox').innerHTML = getHint(num1, num2);
        
        applyStarRules();
        input.focus();

        if (document.getElementById('timedModeToggle').checked) {
            startTimer();
        }
    }

    function toggleHint() {
        const hintBox = document.getElementById('hintBox');
        hintBox.style.display = (hintBox.style.display === 'block') ? 'none' : 'block';
    }

    function checkAnswer(e) {
        e.preventDefault();
        stopTimer();

        const input = document.getElementById('userAnswer');
        const userAns = parseInt(input.value);
        const feedback = document.getElementById('feedback');

        if (userAns === correctAnswer) {
            roundScore++;
            feedback.className = "feedback correct";
            feedback.innerText = "🌟 Correct! Brilliant!";
        } else {
            feedback.className = "feedback wrong";
            feedback.innerText = `❌ Oops! ${num1} × ${num2} = ${correctAnswer}`;
        }

        advanceQuestion();
    }

    function advanceQuestion() {
        if (currentQuestion < 10) {
            currentQuestion++;
            document.getElementById('progressText').innerText = `Question ${currentQuestion} of 10`;
            setTimeout(generateQuestion, 1400);
        } else {
            setTimeout(finishRound, 1400);
        }
    }

    function finishRound() {
        stopTimer();
        const modal = document.getElementById('rewardModal');
        const title = document.getElementById('prizeTitle');
        const desc = document.getElementById('prizeDescription');

        let hitMilestone = false;

        if (roundScore >= 7) {
            // Earn Stars for 7, 8, 9, 10
            totalStars += roundScore;
            localStorage.setItem('totalStars', totalStars);
            updateStarDisplay();

            let wonPrize = roundPrizes.find(p => roundScore >= p.score);
            title.innerText = "🏆 PRIZE UNLOCKED!";
            desc.innerText = `You scored ${roundScore}/10!\nYou earned +${roundScore} Stars! ⭐\n\n${wonPrize.prize}`;

            hitMilestone = checkMilestoneRewards();
        } else if (roundScore === 6) {
            // Safe zone: no stars won or lost
            title.innerText = "Nice Try!";
            desc.innerText = `You scored 6/10.\n\nNo stars lost, but you need at least 7/10 to win stars and prizes from Dad!`;
        } else {
            // Penalty: lose (6 - score) stars
            let starsLost = 6 - roundScore;
            totalStars = Math.max(0, totalStars - starsLost); // Prevent dropping below 0
            localStorage.setItem('totalStars', totalStars);
            updateStarDisplay();

            title.innerText = "⚠️ OH NO!";
            desc.innerText = `You scored ${roundScore}/10.\n\nScoring under 6 cost you -${starsLost} Star${starsLost > 1 ? 's' : ''}! 💔\n\nKeep practicing to earn them back!`;
        }

        if (!hitMilestone) {
            modal.style.display = 'flex';
        }
    }

    function closeModal() {
        document.getElementById('rewardModal').style.display = 'none';
        currentQuestion = 1;
        roundScore = 0;
        document.getElementById('progressText').innerText = `Question 1 of 10`;
        document.getElementById('feedback').innerText = '';
        generateQuestion();
    }

    function closeMilestoneModal() {
        document.getElementById('milestoneModal').style.display = 'none';
        document.getElementById('rewardModal').style.display = 'flex';
    }

    function resetStars() {
        if (confirm("Are you sure you want to reset all stars back to 0?")) {
            totalStars = 0;
            claimedMilestones = [];
            localStorage.removeItem('totalStars');
            localStorage.removeItem('claimedMilestones');
            
            document.getElementById('hardModeToggle').checked = false;
            document.getElementById('timedModeToggle').checked = false;
            
            updateStarDisplay();
            alert("Stars have been reset to 0!");
        }
    }

    // Initialize display & first question
    updateStarDisplay();
    generateQuestion();
</script>

</body>
</html>
