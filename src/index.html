<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Quest & Dad Prizes!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edd liquid, #fed6e3, #d4fc79);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: #ff4757;
            margin-top: 0;
        }

        .progress-bar {
            font-size: 1.1rem;
            color: #57606f;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .stars {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .question-box {
            font-size: 3.5rem;
            font-weight: bold;
            color: #2ed573;
            background: #f1f2f6;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            font-size: 2rem;
            width: 120px;
            text-align: center;
            padding: 10px;
            border: 3px solid #70a1ff;
            border-radius: 10px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #1e90ff;
        }

        button.submit-btn {
            font-size: 1.5rem;
            padding: 10px 25px;
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
            transition: transform 0.1s;
        }

        button.submit-btn:hover {
            transform: scale(1.05);
        }

        .feedback {
            font-size: 1.3rem;
            font-weight: bold;
            height: 30px;
            margin-top: 15px;
        }

        .correct { color: #2ed573; }
        .wrong { color: #ff4757; }

        /* Reward Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: popin 0.3s ease-out;
        }

        @keyframes popin {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        .prize-title {
            font-size: 2rem;
            color: #ffa502;
            margin-bottom: 10px;
        }

        .modal-btn {
            font-size: 1.2rem;
            padding: 10px 20px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>⭐ Times Tables Quest ⭐</h1>
    <div class="stars" id="starContainer">Total Stars: 0 ⭐</div>
    <div class="progress-bar" id="progressText">Question 1 of 10</div>

    <div class="question-box" id="question">? × ?</div>

    <form id="answerForm" onsubmit="checkAnswer(event)">
        <input type="number" id="userAnswer" placeholder="?" required autofocus autocomplete="off">
        <button type="submit" class="submit-btn">Go!</button>
    </form>

    <div class="feedback" id="feedback"></div>
</div>

<!-- Reward Modal -->
<div class="modal" id="rewardModal">
    <div class="modal-content">
        <div class="prize-title" id="prizeTitle">🎉 Round Complete!</div>
        <p id="prizeDescription" style="font-size: 1.2rem;"></p>
        <button class="modal-btn" onclick="closeModal()">Start Next Round!</button>
    </div>
</div>

<script>
    let num1, num2, correctAnswer;
    let currentQuestion = 1;
    let roundScore = 0;
    let totalStars = 0;

    // Dad's Prizes List (You can edit these prizes and scores!)
    const prizes = [
        { score: 10, prize: "🎁 Perfect 10/10! You unlocked: Extra 15 mins stay up time / Tablet time!" },
        { score: 9,  prize: "🍦 9/10 Great job! You unlocked: A Ice Cream / Treat!" },
        { score: 8,  prize: "⭐ 8/10 Well done! You unlocked: Pick tonight's movie or game!" },
        { score: 7,  prize: "👍 7/10 Good effort! Keep going to get the bigger prizes!" }
    ];

    function generateQuestion() {
        num1 = Math.floor(Math.random() * 12) + 1; // 1 to 12
        num2 = Math.floor(Math.random() * 12) + 1; // 1 to 12
        correctAnswer = num1 * num2;
        
        document.getElementById('question').innerText = `${num1} × ${num2}`;
        document.getElementById('userAnswer').value = '';
        document.getElementById('userAnswer').focus();
    }

    function checkAnswer(e) {
        e.preventDefault();
        const input = document.getElementById('userAnswer');
        const userAns = parseInt(input.value);
        const feedback = document.getElementById('feedback');

        if (userAns === correctAnswer) {
            roundScore++;
            totalStars++;
            feedback.className = "feedback correct";
            feedback.innerText = "🌟 Correct! Brilliant!";
        } else {
            feedback.className = "feedback wrong";
            feedback.innerText = `❌ Oops! ${num1} × ${num2} = ${correctAnswer}`;
        }

        document.getElementById('starContainer').innerText = `Total Stars: ${totalStars} ⭐`;

        if (currentQuestion < 10) {
            currentQuestion++;
            document.getElementById('progressText').innerText = `Question ${currentQuestion} of 10`;
            setTimeout(generateQuestion, 1200);
        } else {
            setTimeout(finishRound, 1200);
        }
    }

    function finishRound() {
        const modal = document.getElementById('rewardModal');
        const title = document.getElementById('prizeTitle');
        const desc = document.getElementById('prizeDescription');

        let wonPrize = prizes.find(p => roundScore >= p.score);

        if (wonPrize) {
            title.innerText = "🏆 PRIZE UNLOCKED!";
            desc.innerText = `You scored ${roundScore}/10!\n\n${wonPrize.prize}`;
        } else {
            title.innerText = "Nice Try!";
            desc.innerText = `You scored ${roundScore}/10. Score 7 or more in the next set to win a prize from Dad!`;
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('rewardModal').style.display = 'none';
        currentQuestion = 1;
        roundScore = 0;
        document.getElementById('progressText').innerText = `Question 1 of 10`;
        document.getElementById('feedback').innerText = '';
        generateQuestion();
    }

    // Start first question
    generateQuestion();
</script>

</body>
</html>
