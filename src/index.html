<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Quest & Dad Prizes!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edd8, #fed6e3, #d4fc79);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: #ff4757;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .progress-bar {
            font-size: 1.1rem;
            color: #57606f;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .stars {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .question-box {
            font-size: 3.5rem;
            font-weight: bold;
            color: #2ed573;
            background: #f1f2f6;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            font-size: 2rem;
            width: 120px;
            text-align: center;
            padding: 10px;
            border: 3px solid #70a1ff;
            border-radius: 10px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #1e90ff;
        }

        button.submit-btn {
            font-size: 1.5rem;
            padding: 10px 25px;
            background-color: #ff6b81;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
            transition: transform 0.1s;
        }

        button.submit-btn:hover {
            transform: scale(1.05);
        }

        .hint-btn {
            background: #ffa502;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .hint-btn:hover {
            background: #eccc68;
        }

        .hint-box {
            display: none;
            background: #eccc6833;
            border: 2px dashed #ffa502;
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.95rem;
            color: #57606f;
            text-align: left;
        }

        .feedback {
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 30px;
            margin-top: 15px;
        }

        .correct { color: #2ed573; }
        .wrong { color: #ff4757; }

        /* Reward Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: popin 0.3s ease-out;
        }

        @keyframes popin {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        .prize-title {
            font-size: 2rem;
            color: #ffa502;
            margin-bottom: 10px;
        }

        .modal-btn {
            font-size: 1.2rem;
            padding: 10px 20px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>⭐ Times Tables Quest ⭐</h1>
    <div class="stars" id="starContainer">Total Stars: 0 ⭐</div>
    <div class="progress-bar" id="progressText">Question 1 of 10</div>

    <div class="question-box" id="question">? × ?</div>

    <form id="answerForm" onsubmit="checkAnswer(event)">
        <input type="number" id="userAnswer" placeholder="?" required autofocus autocomplete="off">
        <button type="submit" class="submit-btn">Go!</button>
    </form>

    <br>
    <button type="button" class="hint-btn" onclick="toggleHint()">💡 Need a Hint?</button>
    <div class="hint-box" id="hintBox"></div>

    <div class="feedback" id="feedback"></div>
</div>

<!-- Reward Modal -->
<div class="modal" id="rewardModal">
    <div class="modal-content">
        <div class="prize-title" id="prizeTitle">🎉 Round Complete!</div>
        <p id="prizeDescription" style="font-size: 1.2rem; white-space: pre-line;"></p>
        <button class="modal-btn" onclick="closeModal()">Start Next Round!</button>
    </div>
</div>

<script>
    let num1, num2, correctAnswer;
    let currentQuestion = 1;
    let roundScore = 0;
    let totalStars = 0;

    // Dad's Prizes List
    const prizes = [
        { score: 10, prize: "🎁 Perfect 10/10!\nYou unlocked: Extra 15 mins stay up time / Tablet time!" },
        { score: 9,  prize: "🍦 9/10 Great job!\nYou unlocked: An Ice Cream or Treat!" },
        { score: 8,  prize: "⭐ 8/10 Well done!\nYou unlocked: Pick tonight's movie or game!" },
        { score: 7,  prize: "👍 7/10 Good effort!\nKeep going to get the bigger prizes!" }
    ];

    function getHint(a, b) {
        // Pick whichever number has a specific trick, prioritizing the easier strategy
        const target = (a === 9 || b === 9) ? 9 :
                       (a === 5 || b === 5) ? 5 :
                       (a === 10 || b === 10) ? 10 :
                       (a === 11 || b === 11) ? 11 :
                       (a === 4 || b === 4) ? 4 :
                       (a === 8 || b === 8) ? 8 :
                       (a === 6 || b === 6) ? 6 :
                       (a === 12 || b === 12) ? 12 : a;

        const other = (target === a) ? b : a;

        switch(target) {
            case 1:
                return " Anything times 1 stays the exact same number!";
            case 2:
                return ` Just double ${other}! (${other} +${other})`;
            case 3:
                return ` Double ${other}, then add one more${other}!`;
            case 4:
                return ` Double ${other}, then double it again!`;
            case 5:
                return ` Multiply ${other} by 10 (which is${other * 10}), then cut it in half! (Or count in 5s: 5, 10, 15...)`;
            case 6:
                return ` Multiply ${other} by 5, then add one more${other}!`;
            case 7:
                return ` Multiply ${other} by 5, then add (${other} × 2)!`;
            case 8:
                return ` Double ${other}, double it again, and double it one more time!`;
            case 9:
                return ` <b>Trick 1:</b> Multiply ${other} by 10 (which is${other * 10}), then subtract ${other}!<br><b>Trick 2 (Fingers):</b> Hold out 10 fingers, fold down finger number${other}. Count fingers on the left for tens, right for units!`;
            case 10:
                return ` Just put a 0 on the end of ${other}! (${other} ➔${other}0)`;
            case 11:
                return (other < 10) 
                    ? ` Repeat the digit twice! (${other} becomes ${other}${other})` 
                    : ` Multiply ${other} by 10 (which is ${other * 10}), then add${other}!`;
            case 12:
                return ` Multiply ${other} by 10, then add (${other} × 2)!`;
            default:
                return " Break it down into smaller parts!";
        }
    }

    function generateQuestion() {
        num1 = Math.floor(Math.random() * 12) + 1;
        num2 = Math.floor(Math.random() * 12) + 1;
        correctAnswer = num1 * num2;
        
        document.getElementById('question').innerText = `${num1} ×${num2}`;
        document.getElementById('userAnswer').value = '';
        document.getElementById('hintBox').style.display = 'none';
        document.getElementById('hintBox').innerHTML = getHint(num1, num2);
        document.getElementById('userAnswer').focus();
    }

    function toggleHint() {
        const hintBox = document.getElementById('hintBox');
        if (hintBox.style.display === 'block') {
            hintBox.style.display = 'none';
        } else {
            hintBox.style.display = 'block';
        }
    }

    function checkAnswer(e) {
        e.preventDefault();
        const input = document.getElementById('userAnswer');
        const userAns = parseInt(input.value);
        const feedback = document.getElementById('feedback');

        if (userAns === correctAnswer) {
            roundScore++;
            totalStars++;
            feedback.className = "feedback correct";
            feedback.innerText = "🌟 Correct! Brilliant!";
        } else {
            feedback.className = "feedback wrong";
            feedback.innerText = `❌ Oops! ${num1} × ${num2} =${correctAnswer}`;
        }

        document.getElementById('starContainer').innerText = `Total Stars: ${totalStars} ⭐`;

        if (currentQuestion < 10) {
            currentQuestion++;
            document.getElementById('progressText').innerText = `Question ${currentQuestion} of 10`;
            setTimeout(generateQuestion, 1400);
        } else {
            setTimeout(finishRound, 1400);
        }
    }

    function finishRound() {
        const modal = document.getElementById('rewardModal');
        const title = document.getElementById('prizeTitle');
        const desc = document.getElementById('prizeDescription');

        let wonPrize = prizes.find(p => roundScore >= p.score);

        if (wonPrize) {
            title.innerText = "🏆 PRIZE UNLOCKED!";
            desc.innerText = `You scored ${roundScore}/10!\n\n${wonPrize.prize}`;
        } else {
            title.innerText = "Nice Try!";
            desc.innerText = `You scored ${roundScore}/10.\nScore 7 or more in the next set to win a prize from Dad!`;
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('rewardModal').style.display = 'none';
        currentQuestion = 1;
        roundScore = 0;
        document.getElementById('progressText').innerText = `Question 1 of 10`;
        document.getElementById('feedback').innerText = '';
        generateQuestion();
    }

    // Start first question
    generateQuestion();
</script>

</body>
</html>
